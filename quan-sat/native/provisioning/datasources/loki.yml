apiVersion: 1

datasources:
  - name: Loki
    uid: loki-dahao
    type: loki
    access: proxy
    # Bản native: Loki chạy cùng máy, nghe ở loopback. (Bản container dùng
    # tên dịch vụ `http://loki:3100` trong mạng nội bộ của compose.)
    url: http://127.0.0.1:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      timeout: 60
