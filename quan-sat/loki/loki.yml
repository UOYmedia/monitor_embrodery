# Loki một nốt, lưu xuống đĩa. Không cụm, không S3 — một Mac Mini một xưởng.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Broker phát ~2 bản tin/giây/máy. Mười máy vẫn thừa sức, nhưng đặt trần
  # để một máy phát điên không nuốt hết đĩa.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_streams_per_user: 5000
  max_label_names_per_series: 20
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Giữ 30 ngày. Dài hơn cửa sổ đo K-19 (7 ngày) đủ xa để còn truy lại được.
  retention_period: 720h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

# Tắt hẳn phần gọi về nhà.
analytics:
  reporting_enabled: false

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true
