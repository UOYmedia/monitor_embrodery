apiVersion: 1

providers:
  - name: dahao
    orgId: 1
    folder: Dahao
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # Cho sửa trên giao diện để người vận hành thử nghiệm nhanh; muốn giữ lại thì
    # xuất JSON rồi chép đè file trong grafana/dashboards/.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
